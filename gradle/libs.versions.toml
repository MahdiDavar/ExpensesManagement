foundation = "1.11.2"

coroutine = "1.10.2"
datastorePreferencesCore = "1.2.1"
dagger = "2.59"
room = "2.8.4"
datePicker = "v0.0.8"
constraintlayoutcompose = "1.1.1"

charty = "3.0.0-rc01"
appcompat_version = "1.7.1"
glanceAppwidgetVersion = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
